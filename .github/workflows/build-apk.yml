name: Build APK

on:
  push:
    branches: [ main, github-file-analysis-edfc2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Clone original app
      run: |
        git clone https://github.com/master1moon/song10.git temp-song10
        mkdir -p www
        cp temp-song10/index.html www/
        cp temp-song10/app.js www/
        cp temp-song10/manifest.json www/
        cp temp-song10/serviceworker.js www/
        cp -r temp-song10/css www/ || true
        cp -r temp-song10/fonts www/ || true
        cp -r temp-song10/icons www/ || true
        cp -r temp-song10/js www/ || true
        rm -rf temp-song10
        
    - name: Apply modifications to index.html
      run: |
        sed -i 's|<meta http-equiv="Content-Security-Policy"[^>]*>|<meta http-equiv="Content-Security-Policy" content="default-src '\''self'\'' https: blob:; script-src '\''self'\'' '\''unsafe-inline'\'' '\''unsafe-eval'\'' https:; style-src '\''self'\'' '\''unsafe-inline'\'' https:; img-src '\''self'\'' https: blob:; font-src '\''self'\'' https:; connect-src '\''self'\'' https: blob:; frame-src '\''self'\'' https:;">|g' www/index.html
        sed -i 's|</body>|<script src="capacitor-bridge.js"></script>\n</body>|g' www/index.html
        
    - name: Install Capacitor dependencies
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen @capacitor/status-bar @capacitor/keyboard @capacitor/network @capacitor/app @capacitor/haptics @capacitor/preferences
        
    - name: Add Android platform
      run: |
        npx cap add android || echo "Android platform already exists"
        
    - name: Copy www to Android assets
      run: |
        mkdir -p android/app/src/main/assets/public
        cp -r www/* android/app/src/main/assets/public/ 2>/dev/null || true
        cp capacitor.config.json . 2>/dev/null || true
        
    - name: Sync Capacitor
      run: |
        npx cap copy android || true
        npx cap sync android || true
        
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fastlink-accounts-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
